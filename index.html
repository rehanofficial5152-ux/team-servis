<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Team Servis</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#b71c1c" />
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111111;
      overscroll-behavior-y: contain;
    }

    #tsTopHeader {
      position: sticky;
      top: 0;
      width: 100%;
      height: 56px;
      background: #b71c1c;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 9998;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    .ts-brand-title {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 0.3px;
    }

    .header-menu-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    #threeDotsBtn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 24px;
      cursor: pointer;
      padding: 4px 10px;
      line-height: 1;
    }

    #whatsappDropdown {
      display: none;
      position: absolute;
      right: 0;
      top: 44px;
      background: #ffffff;
      color: #111111;
      min-width: 195px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      z-index: 9999;
      overflow: hidden;
      text-align: left;
    }

    .ts-dropdown-item {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
    }

    .ts-dropdown-item:last-child {
      border-bottom: none;
      font-weight: 600;
    }

    .ts-dropdown-item:active {
      background: #f2f2f2;
    }

    #app {
      width: 100%;
      min-height: calc(100% - 56px);
      padding: 12px;
    }

    #settingsModal {
      display: none;
      position: fixed;
      inset: 0;
      background: #ffffff;
      z-index: 10000;
      flex-direction: column;
    }

    .ts-modal-header {
      background: #b71c1c;
      color: #ffffff;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .ts-back-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 22px;
      cursor: pointer;
    }

    .ts-modal-body {
      padding: 15px;
      overflow-y: auto;
      flex: 1;
    }

    .ts-profile-box {
      display: flex;
      align-items: center;
      gap: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eeeeee;
    }

    .ts-avatar {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: #b71c1c;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .ts-setting-row {
      padding: 15px 0;
      border-bottom: 1px solid #f2f2f2;
      cursor: pointer;
    }

    .ts-setting-title {
      font-weight: 500;
      font-size: 15px;
    }

    .ts-setting-sub {
      font-size: 12px;
      color: #777777;
      margin-top: 2px;
    }

    .ts-logout-btn {
      padding: 15px 0;
      color: #b71c1c;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <!-- Top Header Bar (WhatsApp Style) -->
  <div id="tsTopHeader">
    <div class="ts-brand-title">Team Servis</div>

    <div class="header-menu-wrapper">
      <button id="threeDotsBtn" onclick="toggleMainMenu(event)" aria-label="Menu">&#8942;</button>

      <div id="whatsappDropdown">
        <div class="ts-dropdown-item" onclick="openMenuFeature('New group')">New group</div>
        <div class="ts-dropdown-item" onclick="openMenuFeature('New broadcast')">New broadcast</div>
        <div class="ts-dropdown-item" onclick="openMenuFeature('Starred messages')">Starred messages</div>
        <div class="ts-dropdown-item" onclick="openSettingsModal()">Settings</div>
      </div>
    </div>
  </div>

  <!-- Main App Container -->
  <div id="app"></div>

  <!-- Settings Screen Modal -->
  <div id="settingsModal">
    <div class="ts-modal-header">
      <button class="ts-back-btn" onclick="closeSettingsModal()" aria-label="Back">&#8592;</button>
      <h3 style="margin: 0; font-size: 18px;">Settings</h3>
    </div>

    <div class="ts-modal-body">
      <div class="ts-profile-box">
        <div class="ts-avatar">TS</div>
        <div>
          <div id="settingsUserName" style="font-weight: bold; font-size: 17px;">Team Member</div>
          <div style="color: #666666; font-size: 13px;">Available &bull; Team Servis</div>
        </div>
      </div>

      <div class="ts-setting-row" onclick="testNotificationSound()">
        <div class="ts-setting-title">Notifications &amp; Tune</div>
        <div class="ts-setting-sub">Popup alerts &amp; message tone (Tap to test)</div>
      </div>

      <div class="ts-setting-row" onclick="openMenuFeature('Privacy & Security')">
        <div class="ts-setting-title">Account &amp; Privacy</div>
        <div class="ts-setting-sub">Security notifications, change number</div>
      </div>

      <div class="ts-setting-row" onclick="openMenuFeature('Chats Backup')">
        <div class="ts-setting-title">Chats</div>
        <div class="ts-setting-sub">Theme, wallpapers, chat history</div>
      </div>

      <div class="ts-logout-btn" onclick="logoutUser()">
        Log out
      </div>
    </div>
  </div>

  <script src="./app.js?v=51"></script>
</body>
</html>
